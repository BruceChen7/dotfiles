# herdr-switch — herdr plugin definition
# ======================================
# Search-and-jump switcher for spaces (workspaces) and agents.
# prefix+f → herdr-switch.switch → opens a popup pane running switch.py picker (fzf).
#   enter      → agent.focus / workspace.focus (jump to the pane / space)
#   alt+enter  → agent attach --takeover (take over the agent's terminal)
#   ctrl+x     → close (with confirmation for dangerous targets)
#
# All entrypoints are subcommands of switch.py (open / picker / record /
# toggle / preview); the old bash scripts were deleted after byte-parity
# validation.
#
# Install: herdr plugin link ~/work/dotfiles/herdr/herdr-switch

id = "herdr-switch"
name = "Herdr Switch"
version = "0.7.0"
min_herdr_version = "0.7.4"
description = "Search spaces and agents with fzf; focus or attach"
platforms = ["linux", "macos"]

# The keybinding entry point: opens the picker popup pane.
[[actions]]
id = "switch"
title = "Search space / agent and jump"
contexts = ["global"]
command = ["uv", "run", "switch.py", "open"]

# prefix+^ — toggle between the two most recently focused spaces.
# Reads the previous-space record maintained by the workspace.focused
# event hook (record subcommand) and jumps back, then swaps current/previous
# so the next press returns. Mirrors tmux's last-window.
[[actions]]
id = "toggle"
title = "Toggle between the last two spaces"
contexts = ["global"]
command = ["uv", "run", "switch.py", "toggle"]

# Track the two most recent spaces. Fires on every focus change (including
# same-space pane switches, which are ignored because the workspace id is
# unchanged). Updates the state file atomically.
[[events]]
on = "workspace.focused"
command = ["uv", "run", "switch.py", "record"]

# The popup that hosts the fzf picker. Closes automatically when the
# picker subcommand exits.
[[panes]]
id = "picker"
title = "herdr-switch"
placement = "popup"
width = "85%"
height = "65%"
command = ["uv", "run", "switch.py", "picker"]
